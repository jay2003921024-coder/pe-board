<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>體育教案圖板</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: three-column workbench (tool rack | court | lesson notes) that folds to a single column on phones */
:root{
  --bg:#edf1f0; --surface:#ffffff; --surface-2:#f5f8f7; --ink:#16232a; --muted:#5a6a70;
  --line:#d3dcda; --accent:#1f5fbf; --accent-ink:#ffffff; --accent-soft:#e3ecfa;
  --mark:#f2c230; --stage:#dde4e2; --danger:#c2362e;
  --display:"LXGW WenKai TC","Kaiti TC","STKaiti",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10171a; --surface:#172126; --surface-2:#1c282e; --ink:#e4ebe9; --muted:#93a4a8;
  --line:#2a3a40; --accent:#77a3f2; --accent-ink:#0c1422; --accent-soft:#1d2d47;
  --mark:#f2c230; --stage:#0b1113; --danger:#f0756c; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10171a; --surface:#172126; --surface-2:#1c282e; --ink:#e4ebe9; --muted:#93a4a8;
  --line:#2a3a40; --accent:#77a3f2; --accent-ink:#0c1422; --accent-soft:#1d2d47;
  --mark:#f2c230; --stage:#0b1113; --danger:#f0756c; color-scheme:dark;
}
/* Same basics the Claude page wrapper adds, so the file also works when opened directly in a browser */
[hidden]{display:none!important}
html,body{margin:0}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:1520px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:14px}
.brand{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.04em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.title-in{flex:1 1 240px;min-width:0;font-family:var(--display);font-size:20px;padding:6px 10px;border:1px solid transparent;border-radius:8px;background:transparent}
.title-in:hover{border-color:var(--line)}
.title-in:focus{border-color:var(--accent);background:var(--surface);outline:none}
.top select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default}

.work{display:grid;grid-template-columns:196px minmax(0,1fr) 290px;gap:14px;align-items:start}

/* Tool rack */
.tools{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:14px}
.tg h3{margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.tg-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 5px;border:1px solid transparent;border-radius:8px;background:transparent;font-size:12px;line-height:1.2}
.tool svg{width:30px;height:30px}
.tool{position:relative}
.tkey{position:absolute;top:3px;right:4px;font-family:var(--body);font-size:9px;line-height:1;padding:2px 3px;border-radius:3px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.tool.wide .tkey{position:static;order:3}
.size-row{flex-wrap:nowrap}
.size-row input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.size-row input[type=number]{width:58px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}
.tool:hover{background:var(--surface-2)}
.tool[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.tool.wide{grid-column:1 / -1;flex-direction:row;justify-content:center;gap:8px;padding:8px}
.tool.wide svg{width:20px;height:20px}
.swatches{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.sw-label{font-size:11px;color:var(--muted);margin-top:6px}

/* Stage */
.stage{min-width:0;display:flex;flex-direction:column;gap:10px}
.stage-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.stage-bar select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:500;max-width:100%}
.steps{display:flex;gap:4px;overflow-x:auto;flex:1 1 200px;min-width:0;padding:2px}
.step-tab{flex:none;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.step-tab b{font-variant-numeric:tabular-nums;margin-right:4px}
.step-tab[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.step-add{flex:none;padding:5px 12px;border-radius:999px;border:1px dashed var(--muted);background:transparent;font-size:13px;color:var(--muted)}
.step-add:hover{color:var(--accent);border-color:var(--accent)}
.history{display:flex;gap:4px}
.play{display:flex;gap:4px;align-items:center}
.play select{padding:4px 6px;font-size:13px}
#btnPlay[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#board.animating{cursor:pointer}
.icon-btn{width:34px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn svg{width:18px;height:18px}
.canvas-wrap{background:var(--stage);border-radius:12px;padding:10px;display:flex;justify-content:center}
#board{display:block;width:100%;height:auto;max-height:74vh;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:6px}
#board.placing{cursor:crosshair}
#board .it,#board [data-id]{cursor:move}
#board.placing [data-id]{cursor:crosshair}
#board [data-handle]{cursor:grab}
.hint{font-size:13px;color:var(--muted);min-height:20px}
.hint kbd,.empty kbd{font-family:var(--body);font-size:11px;padding:1px 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--surface)}

/* Notes panel */
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card h2{margin:0 0 10px;font-family:var(--display);font-size:18px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 small{font-family:var(--body);font-size:12px;font-weight:400;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field:last-child{margin-bottom:0}
.field label{font-size:12px;font-weight:500;color:var(--muted)}
.field input[type=text],.field textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.field input[type=text]:focus,.field textarea:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.field textarea{min-height:110px;resize:vertical;line-height:1.6}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.prop-head{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:10px}
.prop-head svg{width:26px;height:26px}
.empty{margin:0;color:var(--muted);font-size:13px;line-height:1.9}

/* Modals */
.modal{position:fixed;inset:0;background:rgba(8,14,16,.55);display:grid;place-items:center;z-index:20;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal-card{background:var(--surface);border-radius:14px;width:min(920px,100%);max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-head h2{margin:0;font-family:var(--display);font-size:22px}
.exp-img{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff;display:block}
.exp-msg{font-size:13px;color:var(--muted);margin:0}
.modal-card.wide{width:min(1120px,100%)}
.modal-card.narrow{width:min(440px,100%)}
.modal-card select{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.lib{display:grid;grid-template-columns:190px minmax(0,1fr);gap:16px;min-height:440px}
.lib-nav{display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);padding-right:12px;min-width:0}
.nav-btn{display:flex;justify-content:space-between;gap:8px;text-align:left;padding:6px 10px;border-radius:8px;border:0;background:transparent;font-size:14px}
.nav-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-btn small{color:var(--muted);font-variant-numeric:tabular-nums}
.nav-btn:hover{background:var(--surface-2)}
.nav-btn[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav-btn.sub{padding-left:22px}
.nav-btn.add{color:var(--muted);font-size:13px}
.nav-h{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:14px 0 4px 10px}
.nav-in{margin:2px 0 2px 12px;padding:5px 8px;border:1px solid var(--accent);border-radius:8px;background:var(--surface);min-width:0}
.lib-main{min-width:0;display:flex;flex-direction:column;gap:10px}
.lib-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lib-tools input{flex:1 1 180px;min-width:0;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.lib-empty{padding:30px 0;grid-column:1 / -1}
.tpl-actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.tpl-actions button,.tpl-actions select{font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);max-width:100%}
.tpl-actions button:hover{border-color:var(--accent)}
.tpl-actions .danger,.btn.danger{color:var(--danger)}
.tpl-open{padding:0;border:0;background:transparent;text-align:left;display:flex;flex-direction:column;gap:6px}
.tpl-rename{padding:4px 8px;border:1px solid var(--accent);border-radius:6px;background:var(--surface);font-weight:700;min-width:0}
.tpl .by{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:40;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media (max-width:700px){
  .lib{grid-template-columns:minmax(0,1fr);min-height:0}
  .lib-nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:0 0 8px}
  .nav-btn{flex:none}.nav-btn.sub{padding-left:10px}.nav-h{display:none}
}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tpl{display:flex;flex-direction:column;gap:6px;text-align:left;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);min-width:0}
.tpl:hover{border-color:var(--accent)}
.tpl .chip{font-style:normal}
.tpl svg{width:100%;height:120px;border-radius:6px;background:var(--stage)}
.tpl strong{font-size:14px}
.tpl span{font-size:12px;color:var(--muted)}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;margin-right:4px}

@media (max-width:1180px){
  .work{grid-template-columns:184px minmax(0,1fr)}
  .panel{grid-column:1 / -1;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
}
@media (max-width:760px){
  .work{grid-template-columns:minmax(0,1fr)}
  .tools{flex-direction:row;overflow-x:auto;gap:16px;padding:10px}
  .tg{flex:none}
  .tg-grid{display:flex;gap:2px}
  .tool{width:56px}
  .tool.wide{width:auto;flex-direction:column;gap:2px;padding:6px 8px}
  .tool.wide svg{width:30px;height:30px}
  .swatches{flex-wrap:nowrap}
  .brand{font-size:22px}
  #board{max-height:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="1.5" y="4.5" width="25" height="19" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><line x1="14" y1="4.5" x2="14" y2="23.5" stroke="currentColor" stroke-width="2"/><circle cx="14" cy="14" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="7" cy="10" r="2.2" fill="#d6453d"/><circle cx="21" cy="18" r="2.2" fill="#2f6fd0"/></svg>
      體育教案圖板
    </div>
    <input id="lessonTitle" class="title-in" type="text" aria-label="單元名稱" placeholder="輸入單元名稱">
    <select id="grade" aria-label="適用年段">
      <option>國小低年級</option><option>國小中年級</option><option>國小高年級</option><option>國中</option><option>高中</option>
    </select>
    <button class="btn" id="btnTemplates" type="button">範本庫</button>
    <button class="btn" id="btnSaveTpl" type="button">存成範本</button>
    <button class="btn primary" id="btnExport" type="button">匯出圖片</button>
  </header>

  <div class="work">
    <aside class="tools" id="tools" aria-label="工具"></aside>

    <main class="stage">
      <div class="stage-bar">
        <select id="court" aria-label="場地"></select>
        <div class="steps" id="steps" role="tablist" aria-label="步驟"></div>
        <div class="play">
          <button class="btn small" id="btnPlay" type="button" title="從目前步驟開始，依序播放人和球的移動">▶ 播放動畫</button>
          <select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
        </div>
        <div class="history">
          <button class="icon-btn" id="btnUndo" type="button" title="復原 (Ctrl+Z)" aria-label="復原"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5 3 9l4 4"/><path d="M3 9h9a5 5 0 0 1 0 10h-2"/></svg></button>
          <button class="icon-btn" id="btnRedo" type="button" title="重做 (Ctrl+Shift+Z)" aria-label="重做"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m13 5 4 4-4 4"/><path d="M17 9H8a5 5 0 0 0 0 10h2"/></svg></button>
        </div>
      </div>
      <div class="canvas-wrap"><svg id="board" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="教案圖畫布"></svg></div>
      <div class="hint" id="hint"></div>
    </main>

    <aside class="panel">
      <section class="card">
        <h2>選取的物件</h2>
        <div id="props"></div>
      </section>
      <section class="card">
        <h2>本步驟 <small id="stepCount"></small></h2>
        <div class="field"><label for="stepName">步驟名稱</label><input id="stepName" type="text" placeholder="例：傳球後切入"></div>
        <div class="field"><label for="stepNote">活動說明</label><textarea id="stepNote" placeholder="寫下這一步的動作要領、口令或安全提醒，會一起出現在匯出的圖片上。"></textarea></div>
        <div class="row">
          <button class="btn small" id="btnClearStep" type="button">清空畫面</button>
          <button class="btn small danger" id="btnDelStep" type="button">刪除此步驟</button>
        </div>
      </section>
      <section class="card">
        <h2>教案資訊</h2>
        <div class="field"><label for="infoPlayers">人數與分組</label><input id="infoPlayers" type="text" placeholder="例：每組 3 人，共 8 組"></div>
        <div class="field"><label for="infoEquip">器材</label><input id="infoEquip" type="text" placeholder="例：籃球 8 顆、三角錐 16 個"></div>
        <div class="field"><label for="infoTime">時間</label><input id="infoTime" type="text" placeholder="例：15 分鐘"></div>
        <div class="field"><label for="iconScale">圖示大小 <span id="iconScaleVal"></span></label><input id="iconScale" type="range" min="0.6" max="1.8" step="0.1"></div>
      </section>
    </aside>
  </div>
</div>

<div class="modal" id="exportModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="expTitle">
    <div class="modal-head">
      <h2 id="expTitle">匯出教案圖</h2>
      <button class="btn small" type="button" data-close>關閉</button>
    </div>
    <div class="row">
      <div class="seg" role="group" aria-label="匯出範圍">
        <button type="button" id="expCur" aria-pressed="true">目前步驟</button>
        <button type="button" id="expAll" aria-pressed="false">全部步驟＋說明</button>
      </div>
      <button class="btn primary small" id="btnCopyImg" type="button">複製圖片</button>
    </div>
    <p class="exp-msg" id="expMsg">在圖片上按右鍵（手機長按）可以「另存圖片」，或按「複製圖片」直接貼進 Word、Google 文件或簡報。</p>
    <img class="exp-img" id="expImg" alt="匯出的教案圖預覽">
  </div>
</div>

<div class="modal" id="tplModal" hidden>
  <div class="modal-card wide" role="dialog" aria-modal="true" aria-labelledby="tplTitle">
    <div class="modal-head">
      <h2 id="tplTitle">範本庫</h2>
      <button class="btn small" type="button" data-close>關閉</button>
    </div>
    <div class="lib">
      <nav class="lib-nav" id="libNav" aria-label="範本分類"></nav>
      <div class="lib-main">
        <div class="lib-tools" id="libTools"></div>
        <p class="exp-msg" id="libMsg"></p>
        <div class="tpl-grid" id="tplGrid"></div>
      </div>
    </div>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
</div>

<div class="modal" id="saveModal" hidden>
  <form class="modal-card narrow" role="dialog" aria-modal="true" aria-labelledby="saveTitle">
    <div class="modal-head">
      <h2 id="saveTitle">存成範本</h2>
      <button class="btn small" type="button" data-close>取消</button>
    </div>
    <div class="field" id="saveModeField" hidden>
      <label>儲存方式</label>
      <div class="seg"><button type="button" data-mode="update">更新「<span id="saveModeName"></span>」</button><button type="button" data-mode="new">另存成新範本</button></div>
    </div>
    <div class="field"><label for="saveName">範本名稱</label><input id="saveName" type="text" maxlength="40" placeholder="例：三人傳切上籃"></div>
    <div class="field"><label for="saveFolder">放進資料夾</label><select id="saveFolder"></select></div>
    <div class="field" id="newFolderField" hidden><label for="saveNewFolder">新資料夾名稱</label><input id="saveNewFolder" type="text" maxlength="40" placeholder="例：七年級 籃球單元"></div>
    <p class="exp-msg" id="saveMsg"></p>
    <div class="row"><button class="btn primary" id="btnDoSave" type="submit">儲存</button></div>
  </form>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
const W = 1000;
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif';
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);

const scaleOf = id => { const c = COURTS[id]; return W / (c.L + 2 * c.m); };
const courtH = id => { const c = COURTS[id]; return (c.B + 2 * c.m) * scaleOf(id); };
const courtCache = {};
function courtSVG(id) {
  if (courtCache[id]) return courtCache[id];
  const c = COURTS[id], s = scaleOf(id);
  return courtCache[id] = `<rect width="${W}" height="${f(courtH(id))}" fill="${c.bg}"/><g transform="translate(${f(c.m * s)} ${f(c.m * s)}) scale(${s})">${c.draw(2.2 / s, s)}</g>`;
}

function shape(it) {
  const mid = 'text-anchor="middle" dominant-baseline="central" font-weight="700"';
  switch (it.type) {
    case 'player': {
      const t = TEAMS[it.team] || TEAMS.red, lab = String(it.label ?? '');
      return `<circle r="14" fill="${t.fill}" stroke="${t.stroke}" stroke-width="2.5"/><text y="0.5" font-size="${lab.length > 2 ? 9 : lab.length > 1 ? 12 : 14}" fill="${t.text}" ${mid}>${esc(lab)}</text>`;
    }
    case 'teacher': return `<circle r="15" fill="#1f2328" stroke="#f2c230" stroke-width="3"/><text y="0.5" font-size="14" fill="#f2c230" ${mid}>師</text>`;
    case 'cone': return `<path d="M0 -13L10 10H-10Z" fill="#f07a1a" stroke="#a84a08" stroke-width="1.5" stroke-linejoin="round"/><path d="M-5.2 -1H5.2" stroke="#fff" stroke-width="2.5"/>`;
    case 'disc': return `<ellipse rx="10" ry="6" fill="#f2c230" stroke="#9b7a10" stroke-width="1.5"/><ellipse rx="3.5" ry="2" fill="#9b7a10" opacity="0.5"/>`;
    case 'ball': return `<circle r="8" fill="${it.color || '#e07a2c'}" stroke="#2a2a2a" stroke-width="1.5"/><path d="M-8 0H8M0 -8V8" stroke="#2a2a2a" stroke-width="1" opacity="0.5"/>`;
    case 'hoop': return `<circle r="17" fill="none" stroke="#5a1a40" stroke-width="6" opacity="0.35"/><circle r="17" fill="none" stroke="#e04aa8" stroke-width="4"/>`;
    case 'hurdle': return `<rect x="-18" y="-3.5" width="36" height="7" fill="#fff" stroke="#b8322a" stroke-width="1.5"/><path d="M-9 -3.5v7M0 -3.5v7M9 -3.5v7" stroke="#b8322a" stroke-width="3"/>`;
    case 'ladder': {
      const rails = 'M-9 -40V40M9 -40V40', rungs = 'M-9 -30H9M-9 -15H9M-9 0H9M-9 15H9M-9 30H9';
      return `<path d="${rails} ${rungs}" stroke="#4a3a00" stroke-width="5" stroke-linecap="round"/><path d="${rails} ${rungs}" stroke="#f2c230" stroke-width="2.6" stroke-linecap="round"/>`;

    case 'mat': return `<rect x="-24" y="-32" width="48" height="64" rx="3" fill="#3f78d6" stroke="#1d4a91" stroke-width="2"/><text font-size="13" fill="#fff" ${mid}>${esc(it.label || '軟墊')}</text>`;
    case 'kick': return `<rect x="-7.5" y="-11" width="15" height="22" rx="6" fill="#f6f6f2" stroke="#1f5fbf" stroke-width="2.2"/><rect x="-4" y="-7.5" width="8" height="5" rx="2" fill="#1f5fbf" opacity="0.55"/>`;
    case 'text': {
      const halo = (it.color || '#141414').toLowerCase() === '#ffffff' ? '#141414' : '#ffffff';
      return `<text font-size="${it.size || 18}" fill="${it.color || '#141414'}" stroke="${halo}" stroke-width="4" paint-order="stroke" stroke-linejoin="round" ${mid}>${esc(it.label || '文字')}</text>`;

}
const textUnits = s => [...String(s || '')].reduce((n, ch) => n + (/[\u0000-\u00ff]/.test(ch) ? 0.58 : 1), 0);
const textHalfW = it => Math.max(8, textUnits(it.label || '文字') * (it.size || 18) / 2);
const TEXT_MIN = 8, TEXT_MAX = 120;
const clampSize = v => Math.max(TEXT_MIN, Math.min(TEXT_MAX, Math.round(v)));
function selR(it) {
  if (it.type === 'text') return Math.max(16, textHalfW(it) + 6);
  return ITEMS[it.type].r;
}
function itemSVG(it, k, hit) {
  const r = it.rot ? ` rotate(${it.rot})` : '';
  const pad = hit ? `<circle r="${f(selR(it) * 0.9)}" fill="transparent"/>` : '';
  return `<g ${hit ? `data-id="${it.id}" ` : ''}transform="translate(${f(it.x)} ${f(it.y)})${r} scale(${k})">${pad}${shape(it)}</g>`;
}

const qpt = (t, l) => { const u = 1 - t; return [u * u * l.x1 + 2 * u * t * l.cx + t * t * l.x2, u * u * l.y1 + 2 * u * t * l.cy + t * t * l.y2]; };
const qder = (t, l) => [2 * (1 - t) * (l.cx - l.x1) + 2 * t * (l.x2 - l.cx), 2 * (1 - t) * (l.cy - l.y1) + 2 * t * (l.y2 - l.cy)];

function lineSVG(l, hit) {
  const c = l.color || '#141414';
  const id = hit ? `data-id="${l.id}" ` : '';
  if (l.type === 'zone') {
    const x = Math.min(l.x1, l.x2), y = Math.min(l.y1, l.y2), w = Math.abs(l.x2 - l.x1), h = Math.abs(l.y2 - l.y1);
    const halo = c.toLowerCase() === '#ffffff' ? '#141414' : '#ffffff';
    const lab = l.label ? `<text x="${f(x + 8)}" y="${f(y + 18)}" font-size="15" font-weight="700" fill="${c}" stroke="${halo}" stroke-width="3.5" paint-order="stroke">${esc(l.label)}</text>` : '';
    // Zones are grabbed by their edge or label only, so a box selection can start inside them.
    const edge = hit ? `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="6" fill="none" stroke="transparent" stroke-width="16"/>` : '';
    return `<g ${id}><rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="6" fill="${c}" fill-opacity="0.16" stroke="${c}" stroke-width="2.5" stroke-dasharray="10 6"${hit ? ' pointer-events="none"' : ''}/>${edge}${lab}</g>`;
  }
  let [dx, dy] = qder(1, l), d = Math.hypot(dx, dy);
  if (d < 1) { dx = l.x2 - l.x1; dy = l.y2 - l.y1; d = Math.hypot(dx, dy) || 1; }
  const ux = dx / d, uy = dy / d, AL = 15, AW = 7.5;
  const bx = l.x2 - ux * AL, by = l.y2 - uy * AL;
  const head = `<path d="M${f(l.x2)} ${f(l.y2)}L${f(bx - uy * AW)} ${f(by + ux * AW)}L${f(bx + uy * AW)} ${f(by - ux * AW)}Z" fill="${c}"/>`;
  const curve = `M${f(l.x1)} ${f(l.y1)}Q${f(l.cx)} ${f(l.cy)} ${f(bx)} ${f(by)}`;
  let body;
  if (l.type === 'dribble') {
    const seg = { x1: l.x1, y1: l.y1, cx: l.cx, cy: l.cy, x2: bx, y2: by };
    const N = 90, pts = [];
    let prev = qpt(0, seg), len = 0;
    const samples = [];
    for (let i = 0; i <= N; i++) { const p = qpt(i / N, seg); len += Math.hypot(p[0] - prev[0], p[1] - prev[1]); prev = p; samples.push([p, len]); }
    samples.forEach(([p, s], i) => {
      let [tx, ty] = qder(i / N, seg); const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      const taper = Math.min(1, s / 10, (len - s) / 10);
      const a = 5.5 * Math.sin(s / 15 * Math.PI * 2) * taper;
      pts.push(`${f(p[0] - ty * a)} ${f(p[1] + tx * a)}`);
    });
    body = `<path d="M${pts.join('L')}" fill="none" stroke="${c}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
  } else {
    body = `<path d="${curve}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"${l.type === 'pass' ? ' stroke-dasharray="9 7"' : ''}/>`;
  }
  const hitPath = hit ? `<path d="M${f(l.x1)} ${f(l.y1)}Q${f(l.cx)} ${f(l.cy)} ${f(l.x2)} ${f(l.y2)}" fill="none" stroke="transparent" stroke-width="18"/>` : '';
  return `<g ${id}>${hitPath}${body}${head}</g>`;
}

function boardContent(courtId, st, k, hit) {
  const zones = [], lines = [], items = [], texts = [];
  for (const o of st.items) {
    if (o.type === 'zone') zones.push(lineSVG(o, hit));
    else if (LINES[o.type]) lines.push(lineSVG(o, hit));
    else if (o.type === 'text') texts.push(itemSVG(o, k, hit));
    else items.push(itemSVG(o, k, hit));
  }
  return `<g font-family='${FONT}'>${courtSVG(courtId)}${zones.join('')}${lines.join('')}${items.join('')}${texts.join('')}</g>`;
}

    let line = '', u = 0;

}

  let y = pad, body = '';

  body += `<text x="${pad}" y="${y + 30}" font-size="30" font-weight="700" fill="#16232a">${esc(doc.title || '體育教案')}</text>`;
  const metaLines = wrapText(meta.join('｜'), 62);
  metaLines.forEach((l, i) => { body += `<text x="${pad}" y="${y + 60 + i * 22}" font-size="15" fill="#4f5d63">${esc(l)}</text>`; });
  y += 60 + metaLines.length * 22 + 10;
  for (const i of indices) {
    const st = doc.steps[i];

      y += 42;

    y += H + 16;

      const lines = wrapText(st.note, 56);

const LKEY = 'pe-board-mytpl-v1';

function libList() {
  let arr;
  if (lib.view === 'builtin') arr = TEMPLATES.map((t, i) => ({ id: 'b' + i, builtin: i, name: t.title, grade: t.grade, court: t.court, doc: getBuiltinDocs()[i] }));
  else if (lib.view === 'shared') arr = lib.shared;
  else arr = lib.mine.filter(t => lib.folder === null || (t.folder || '') === lib.folder);
  const q = lib.q.trim().toLowerCase();
  arr = arr.filter(t => (!q || (t.name || '').toLowerCase().includes(q) || (t.folder || '').toLowerCase().includes(q)) && (!lib.court || t.court === lib.court) && (!lib.grade || t.grade === lib.grade));
  if (lib.view !== 'builtin') arr = [...arr].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  return arr;
}
function renderLibNav() {
  const cnt = fn => lib.mine.filter(fn).length;
  const nb = (label, n, attrs, cur, sub) => `<button type="button" class="nav-btn${sub ? ' sub' : ''}" ${attrs} aria-current="${cur}"><span>${label}</span><small>${n}</small></button>`;
  let h = nb('內建範本', TEMPLATES.length, 'data-view="builtin"', lib.view === 'builtin');
  h += `<div class="nav-h">我的範本</div>`;
  h += nb('全部', lib.mine.length, 'data-view="mine" data-folder="*"', lib.view === 'mine' && lib.folder === null);
  for (const fd of allFolders()) h += nb(esc(fd), cnt(t => t.folder === fd), `data-view="mine" data-folder="${esc(fd)}"`, lib.view === 'mine' && lib.folder === fd, true);
  if (cnt(t => !t.folder)) h += nb('未分類', cnt(t => !t.folder), 'data-view="mine" data-folder=""', lib.view === 'mine' && lib.folder === '', true);
  h += lib.newFolder
    ? `<input type="text" id="newFolderIn" class="nav-in" placeholder="資料夾名稱，按 Enter" maxlength="40">`
    : `<button type="button" class="nav-btn add" data-act="newFolder">＋ 新資料夾</button>`;
  if (lib.db) { h += `<div class="nav-h">共用</div>` + nb('學校共用', lib.shared.length, 'data-view="shared"', lib.view === 'shared'); }
  $('#libNav').innerHTML = h;
  const nf = $('#newFolderIn'); if (nf) nf.focus();
}
function renderLibTools() {
  const courtOpts = Object.entries(COURTS).map(([id, c]) => `<option value="${id}"${lib.court === id ? ' selected' : ''}>${c.name}</option>`).join('');
  const grades = ['國小低年級', '國小中年級', '國小高年級', '國中', '高中'].map(g => `<option${lib.grade === g ? ' selected' : ''}>${g}</option>`).join('');
  let h = `<input type="search" id="libQ" placeholder="搜尋範本名稱" value="${esc(lib.q)}" aria-label="搜尋範本">
    <select id="libCourt" aria-label="篩選運動"><option value="">全部運動</option>${courtOpts}</select>
    <select id="libGrade" aria-label="篩選年段"><option value="">全部年段</option>${grades}</select>`;
  if (lib.view === 'mine') {
    if (lib.folder) {
      h += lib.renamingFolder
        ? `<input type="text" id="folderNameIn" value="${esc(lib.folder)}" maxlength="40" aria-label="新的資料夾名稱">`
        : `<button type="button" class="btn small" data-act="renameFolder">重新命名資料夾</button><button type="button" class="btn small danger" data-act="delFolder">刪除資料夾</button>`;
    }
    h += `<button type="button" class="btn small" data-act="import">匯入範本檔</button><button type="button" class="btn small" data-act="exportFile">匯出${lib.folder ? '這個資料夾' : '全部'}</button>`;
  }
  $('#libTools').innerHTML = h;
  const fi = $('#folderNameIn'); if (fi) { fi.focus(); fi.select(); }
  const where = !lib.ready ? '正在連線…' : cloudMine() ? '「我的範本」存在你的 Claude 帳號裡，換電腦打開這個頁面也看得到。' : '「我的範本」目前只存在這個瀏覽器裡，建議定期「匯出」範本檔備份。';
  const hint = lib.view === 'shared' ? '「學校共用」是所有打開這個頁面的老師都看得到的範本。存到我的範本後就可以自由修改。' : lib.view === 'builtin' ? '開啟範本會取代目前的畫面；開錯了按「復原」就能回來。' : where;
  $('#libMsg').textContent = hint;
}
function renderLibGrid() {
  const arr = libList();
  const fopts = sel => `<option value=""${!sel ? ' selected' : ''}>未分類</option>` + allFolders().map(fd => `<option value="${esc(fd)}"${sel === fd ? ' selected' : ''}>${esc(fd)}</option>`).join('');
  let h = '';
  if (lib.view === 'builtin' && !lib.q && !lib.court && !lib.grade) {
    h += `<div class="tpl"><button type="button" class="tpl-open" data-open="blank"><svg viewBox="0 0 ${W} ${f(courtH(doc.court))}" preserveAspectRatio="xMidYMid meet">${courtSVG(doc.court)}</svg><strong>空白教案</strong><span>保留目前的場地，從頭開始畫</span></button></div>`;
  }
  for (const t of arr) {
    const meta = `<em class="chip">${esc(t.grade || '')}</em>${esc(COURTS[t.court]?.name || '')}${t.steps || t.doc?.steps?.length ? `・${t.steps || t.doc.steps.length} 步` : ''}`;
    const name = lib.renaming === t.id
      ? `<input type="text" class="tpl-rename" data-id="${t.id}" value="${esc(t.name)}" maxlength="40" aria-label="範本名稱">`
      : `<strong>${esc(t.name || '未命名')}</strong>`;
    let acts = `<button type="button" data-act="open" data-id="${t.id}">開啟</button>`;
    if (lib.view === 'mine') {
      acts += `<select data-act="move" data-id="${t.id}" aria-label="移到資料夾">${fopts(t.folder || '')}</select>`
        + `<button type="button" data-act="rename" data-id="${t.id}">改名</button><button type="button" data-act="copy" data-id="${t.id}">複製</button>`
        + (lib.db && lib.canShare ? `<button type="button" data-act="share" data-id="${t.id}">分享到共用</button>` : '')
        + `<button type="button" class="danger" data-act="del" data-id="${t.id}">刪除</button>`;
    } else {
      acts += `<button type="button" data-act="keep" data-id="${t.id}">存到我的範本</button>`;
      if (lib.view === 'shared' && (t.author === lib.uid || lib.isOwner)) acts += `<button type="button" class="danger" data-act="unshare" data-id="${t.id}">${t.author === lib.uid ? '取消分享' : '移除（管理者）'}</button>`;
    }
    const by = lib.view === 'shared' && t.author ? `<span class="by" data-author="${esc(t.author)}"></span>` : '';
    h += `<div class="tpl"><button type="button" class="tpl-open" data-act="open" data-id="${t.id}" title="開啟">${thumb(t.doc)}</button>${name}<span>${meta}</span>${by}<div class="tpl-actions">${acts}</div></div>`;
  }
  if (!arr.length && !(lib.view === 'builtin' && h)) {
    h = `<p class="empty lib-empty">${lib.view === 'mine'
      ? (lib.mine.length ? '這裡沒有符合條件的範本。' : '還沒有自己的範本。畫好一份教案後，按上方的「存成範本」，就會出現在這裡。')
      : lib.view === 'shared' ? '還沒有人分享範本。在「我的範本」按「分享到共用」，同事打開這個頁面就看得到。' : '沒有符合條件的範本。'}</p>`;
  }
  $('#tplGrid').innerHTML = h;
  const ri = document.querySelector('.tpl-rename'); if (ri) { ri.focus(); ri.select(); }
  if (lib.view === 'shared' && lib.user) {
    const ids = [...new Set(arr.map(t => t.author).filter(Boolean))];
    if (ids.length) lib.user.profiles(ids).then(ps => {
      document.querySelectorAll('[data-author]').forEach(el => { const p = ps[el.dataset.author]; el.textContent = p && p.isMe ? '你分享的' : `由 ${(p && p.name) || '同事'} 分享`; });
    });
  }
}
function renderLib() { renderLibNav(); renderLibTools(); renderLibGrid(); }
function refreshLib() {
  if (!$('#tplModal').hidden) renderLib();
  if (!$('#saveModal').hidden) fillSaveFolders();
}
const findLibItem = id => libList().find(t => t.id === id) || lib.mine.find(t => t.id === id) || lib.shared.find(t => t.id === id);
function armDanger(b, label, fn) {
  if (b.dataset.armed) { fn(); return; }
  const old = b.textContent; b.dataset.armed = '1'; b.textContent = label;
  setTimeout(() => { if (b.isConnected) { b.textContent = old; delete b.dataset.armed; } }, 3000);
}
async function libAct(act, b) {
  const t = b.dataset.id ? findLibItem(b.dataset.id) : null;
  try {
    if (act === 'open' && t) openDoc(t.builtin !== undefined ? docFromTemplate(TEMPLATES[t.builtin]) : t.doc, lib.view === 'mine' ? t.id : null);
    else if (act === 'rename' && t) { lib.renaming = t.id; renderLibGrid(); }
    else if (act === 'copy' && t) { await saveTpl({ ...t, id: 't' + uid(), name: `${t.name}（副本）` }); toast('已複製範本'); }
    else if (act === 'del' && t) armDanger(b, '確定刪除？', async () => { await deleteTpl(t.id); toast(`已刪除「${t.name}」`); });
    else if (act === 'keep' && t) {
      const src = t.builtin !== undefined ? docFromTemplate(TEMPLATES[t.builtin]) : t.doc;
      await saveTpl({ ...tplFromDoc(src, { name: t.name }), id: 't' + uid(), folder: lib.lastFolder });
      toast(`已存到我的範本${lib.lastFolder ? `「${lib.lastFolder}」` : ''}`);
    }
    else if (act === 'share' && t) {
      const { id, folder, ...body } = t;
      const now = Date.now();
      await lib.db.collection(`pub/${lib.uid}/items`).doc('s' + uid()).set({ ...body, kind: 'tpl', updatedAt: now });
      await lib.db.doc('pub/' + lib.uid).set({ updatedAt: now });
      await loadShared();
      toast('已分享到學校共用範本');
    }
    else if (act === 'unshare' && t) armDanger(b, '確定取消？', async () => { await lib.db.collection(`pub/${t.author}/items`).doc(t.id).delete(); await loadShared(); toast(t.author === lib.uid ? '已取消分享' : '已從共用範本移除'); });
    else if (act === 'newFolder') { lib.newFolder = true; renderLibNav(); }
    else if (act === 'renameFolder') { lib.renamingFolder = true; renderLibTools(); }
    else if (act === 'delFolder') armDanger(b, '確定刪除？裡面的範本會移到「未分類」', async () => {
      const name = lib.folder;
      for (const x of lib.mine.filter(x => x.folder === name)) await saveTpl({ ...x, folder: '' });
      await saveFolders(lib.folders.filter(x => x !== name)); lib.folder = null; renderLib(); toast(`已刪除資料夾「${name}」`);
    });
    else if (act === 'import') $('#importFile').click();
    else if (act === 'exportFile') exportTemplates();
  } catch (e) { toast(errText(e)); }
}
async function exportTemplates() {
  const list = lib.mine.filter(t => lib.folder === null || (t.folder || '') === lib.folder);
  if (!list.length) { toast('這裡還沒有範本可以匯出'); return; }
  const data = JSON.stringify({ app: 'pe-board', version: 1, exportedAt: new Date().toISOString(), templates: list.map(({ id, kind, ...r }) => r) }, null, 1);
  const filename = `體育教案範本-${lib.folder || '全部'}.json`;
  if (lib.dl) {
    try { await lib.dl.save({ filename, data }); toast(`已匯出 ${list.length} 個範本`); }
    catch (e) { if (e && e.code !== 'declined') toast('這裡沒辦法下載檔案。'); }
    return;
  }
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  } catch (e) { toast('這裡沒辦法下載檔案。'); }
}
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const list = Array.isArray(data.templates) ? data.templates : data.steps ? [{ name: data.title, doc: data }] : [];
    if (!list.length) { toast('這個檔案裡找不到範本。'); return; }
    const newFolders = [];
    for (const x of list) {
      const folder = typeof x.folder === 'string' ? x.folder.slice(0, 40) : '';
      if (folder) newFolders.push(folder);
      await saveTpl({ ...tplFromDoc(x.doc, { name: String(x.name || x.doc?.title || '匯入的範本').slice(0, 40) }), id: 't' + uid(), folder });
    }
    if (newFolders.length) await saveFolders([...lib.folders, ...newFolders]);
    toast(`已匯入 ${list.length} 個範本`);
  } catch (err) { toast('讀不懂這個檔案，請選擇從這裡匯出的 .json 範本檔。'); }
});
$('#libNav').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.act) { libAct(b.dataset.act, b); return; }
  lib.view = b.dataset.view; lib.folder = b.dataset.folder === undefined || b.dataset.folder === '*' ? null : b.dataset.folder;
  lib.renaming = null; lib.renamingFolder = false; if (lib.folder) lib.lastFolder = lib.folder; renderLib();
  if (lib.view === 'shared') loadShared();
});
$('#libNav').addEventListener('keydown', async e => {
  if (e.target.id !== 'newFolderIn') return;
  if (e.key === 'Escape') { e.stopPropagation(); lib.newFolder = false; renderLibNav(); return; }
  if (e.key !== 'Enter') return;
  const name = e.target.value.trim(); lib.newFolder = false;
  if (name) { try { await saveFolders([...lib.folders, name]); lib.view = 'mine'; lib.folder = name; lib.lastFolder = name; } catch (err) { toast(errText(err)); } }
  renderLib();
});
$('#libNav').addEventListener('focusout', e => { if (e.target.id === 'newFolderIn' && !e.target.value.trim()) { lib.newFolder = false; setTimeout(renderLibNav); } });
$('#libTools').addEventListener('click', e => { const b = e.target.closest('button[data-act]'); if (b) libAct(b.dataset.act, b); });
$('#libTools').addEventListener('input', e => {
  if (e.target.id === 'libQ') { lib.q = e.target.value; renderLibGrid(); }
});
$('#libTools').addEventListener('change', e => {
  if (e.target.id === 'libCourt') { lib.court = e.target.value; renderLibGrid(); }
  if (e.target.id === 'libGrade') { lib.grade = e.target.value; renderLibGrid(); }
});
$('#libTools').addEventListener('keydown', async e => {
  if (e.target.id !== 'folderNameIn') return;
  if (e.key === 'Escape') { e.stopPropagation(); lib.renamingFolder = false; renderLibTools(); return; }
  if (e.key !== 'Enter') return;
  const from = lib.folder, to = e.target.value.trim(); lib.renamingFolder = false;
  if (to && to !== from) {
    try {
      for (const x of lib.mine.filter(x => x.folder === from)) await saveTpl({ ...x, folder: to });
      await saveFolders(lib.folders.map(x => x === from ? to : x).concat(to));
      lib.folder = to; lib.lastFolder = to; toast(`資料夾改名為「${to}」`);
    } catch (err) { toast(errText(err)); }
  }
  renderLib();
});
$('#tplGrid').addEventListener('click', e => {
  const b = e.target.closest('[data-act],[data-open]'); if (!b || b.tagName === 'SELECT') return;
  if (b.dataset.open === 'blank') {
    openDoc({ title: '', grade: doc.grade, court: doc.court, iconScale: doc.iconScale || 1, steps: [{ id: uid(), name: '', note: '', items: [] }] });
    return;
  }
  libAct(b.dataset.act, b);
});
$('#tplGrid').addEventListener('change', async e => {
  const el = e.target, t = el.dataset.id && lib.mine.find(x => x.id === el.dataset.id); if (!t) return;
  try {
    if (el.dataset.act === 'move') { await saveTpl({ ...t, folder: el.value }); toast(el.value ? `已移到「${el.value}」` : '已移到「未分類」'); }
    if (el.classList.contains('tpl-rename')) { const n = el.value.trim(); lib.renaming = null; if (n && n !== t.name) await saveTpl({ ...t, name: n }); else renderLibGrid(); }
  } catch (err) { toast(errText(err)); }
});
$('#tplGrid').addEventListener('keydown', e => {
  if (!e.target.classList.contains('tpl-rename')) return;
  if (e.key === 'Enter') e.target.blur();
  if (e.key === 'Escape') { e.stopPropagation(); lib.renaming = null; renderLibGrid(); }
});
$('#btnTemplates').addEventListener('click', () => { renderLib(); $('#tplModal').hidden = false; });

/* ---------- Save as template ---------- */
let saveMode = 'new';
function fillSaveFolders() {
  const sel = $('#saveFolder'), cur = sel.value;
  sel.innerHTML = `<option value="">未分類</option>` + allFolders().map(fd => `<option value="${esc(fd)}">${esc(fd)}</option>`).join('') + `<option value="__new">＋ 新資料夾…</option>`;
  sel.value = [...sel.options].some(o => o.value === cur) ? cur : '';
}
function setSaveMode(m) { saveMode = m; document.querySelectorAll('#saveModeField [data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m)); }
$('#btnSaveTpl').addEventListener('click', async () => {
  stopAnim();
  const src = doc.srcTpl && lib.mine.find(t => t.id === doc.srcTpl);
  $('#saveName').value = src ? src.name : (doc.title || '');
  fillSaveFolders(); $('#saveFolder').value = src ? (src.folder || '') : lib.lastFolder;
  if (![...$('#saveFolder').options].some(o => o.value === $('#saveFolder').value)) $('#saveFolder').value = '';
  $('#newFolderField').hidden = true; $('#saveNewFolder').value = '';
  $('#saveModeField').hidden = !src; if (src) $('#saveModeName').textContent = src.name;
  setSaveMode(src ? 'update' : 'new');
  $('#saveMsg').textContent = !lib.ready ? '正在連線…' : cloudMine() ? '範本會存在你的 Claude 帳號裡。' : '範本會存在這個瀏覽器裡。';
  $('#saveModal').hidden = false; $('#saveName').focus(); $('#saveName').select();
});
$('#saveFolder').addEventListener('change', e => { $('#newFolderField').hidden = e.target.value !== '__new'; if (e.target.value === '__new') $('#saveNewFolder').focus(); });
$('#saveModeField').addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if (b) setSaveMode(b.dataset.mode); });
$('#saveModal').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('#saveName').value.trim() || doc.title || '未命名教案';
  let folder = $('#saveFolder').value;
  if (folder === '__new') { folder = $('#saveNewFolder').value.trim(); if (!folder) { $('#saveNewFolder').focus(); return; } }
  const btn = $('#btnDoSave'); btn.disabled = true; $('#saveMsg').textContent = '儲存中…';
  try {
    if (folder && !allFolders().includes(folder)) await saveFolders([...lib.folders, folder]);
    const id = saveMode === 'update' && doc.srcTpl ? doc.srcTpl : 't' + uid();
    await saveTpl({ ...tplFromDoc(doc, { name }), id, folder });
    doc.srcTpl = id; save(); lib.lastFolder = folder;
    $('#saveModal').hidden = true; $('#saveMsg').textContent = ''; toast(`已存到我的範本${folder ? `「${folder}」` : ''}`);
  } catch (err) { $('#saveMsg').textContent = errText(err); }
  finally { btn.disabled = false; }
});

function closeModals() { $('#exportModal').hidden = true; $('#tplModal').hidden = true; $('#saveModal').hidden = true; lib.renaming = null; lib.newFolder = false; lib.renamingFolder = false; }
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModals));
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) closeModals(); }));

/* ---------- Boot ---------- */
syncInputs(); renderTools(); renderAll();
})();
</script>
